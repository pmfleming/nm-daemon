name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: nm-daemon

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nm-daemon
      # Cargo and Nix both consume this current sibling, never a framework pin.
      - uses: actions/checkout@v4
        with:
          repository: pmfleming/daemon-framework
          ref: main
          path: daemon-framework
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --summary-only --fail-under-lines 40

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nm-daemon
      - uses: actions/checkout@v4
        with:
          repository: pmfleming/daemon-framework
          ref: main
          path: daemon-framework
      - uses: cachix/install-nix-action@v31
      - run: python3 ../daemon-framework/tools/local-build.py check . --print-build-logs
