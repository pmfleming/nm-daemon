name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    working-directory: nm-daemon

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nm-daemon
      # Cargo and Nix both consume this current sibling, never a framework pin.
      - uses: actions/checkout@v4
        with:
          repository: pmfleming/daemon-framework
          ref: main
          path: daemon-framework
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y dbus-daemon
      - run: python3 -B -m unittest discover -s tools/tests -v
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - uses: taiki-e/install-action@cargo-llvm-cov
      - run: cargo llvm-cov --summary-only --fail-under-lines 40

  nix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: nm-daemon
      - uses: actions/checkout@v4
        with:
          repository: pmfleming/daemon-framework
          ref: main
          path: daemon-framework
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            system-features = nixos-test benchmark big-parallel kvm
            max-jobs = 2
      - uses: dtolnay/rust-toolchain@stable
      - name: Enable KVM for isolated radio/network tests
        run: test -c /dev/kvm && sudo chmod a+rw /dev/kvm
      - name: Record co-development framework revision
        run: git -C ../daemon-framework rev-parse HEAD
      # Includes all six NM/backend combinations, enterprise, migration and Cast.
      - run: ../daemon-framework/tools/local-build check . --print-build-logs
