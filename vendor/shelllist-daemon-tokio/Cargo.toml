[package]
name = "shelllist-daemon-tokio"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Tokio and D-Bus transport infrastructure for Shelllist daemons"
repository = "https://github.com/pmfleming/daemon-framework"

[dependencies]
anyhow = "1"
futures = "0.3"
serde_json = "1"
shelllist-daemon-core = { path = "../shelllist-daemon-core" }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "signal", "sync", "time"] }
tracing = "0.1"
zbus = { version = "5", features = ["tokio"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
