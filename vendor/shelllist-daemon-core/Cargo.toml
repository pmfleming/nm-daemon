[package]
name = "shelllist-daemon-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
description = "Runtime-independent protocol infrastructure for Shelllist daemons"
repository = "https://github.com/pmfleming/daemon-framework"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
