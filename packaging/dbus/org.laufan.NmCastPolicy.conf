<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.laufan.NmCastPolicy"/>
  </policy>
  <policy context="default">
    <!-- No arguments, no caller-selected interface/ports/policy, no shell commands.
         Re-read only the policy already authorized and stored by NetworkManager. -->
    <allow send_destination="org.laufan.NmCastPolicy"
           send_interface="org.laufan.NmCastPolicy1" send_member="Reconcile"/>
    <allow send_destination="org.laufan.NmCastPolicy"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.laufan.NmCastPolicy"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
