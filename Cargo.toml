[package]
name = "nm-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/pmfleming/nm-daemon"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
futures = "0.3"
neli = "0.6.5"
neli-wifi = "0.6.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shelllist-daemon-core = { git = "https://github.com/pmfleming/daemon-framework.git", rev = "278bff245613293918ac7107ff8937e0f7e94fd6" }
shelllist-daemon-tokio = { git = "https://github.com/pmfleming/daemon-framework.git", rev = "278bff245613293918ac7107ff8937e0f7e94fd6" }
rustix = { version = "1", features = ["fs", "process"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zbus = { version = "5", features = ["blocking"] }
zvariant = "5"

[dev-dependencies]
zbus = { version = "5", features = ["blocking", "bus-impl", "p2p"] }
